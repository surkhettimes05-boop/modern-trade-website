workflows:
  android-test:
    name: NOVA MART Android test
    max_build_duration: 30
    environment:
      flutter: stable
      vars:
        API_BASE_URL: https://storesync-backend-dg8z.onrender.com
    scripts:
      - name: Install dependencies
        script: cd modern_trade_flutter && flutter pub get
      - name: Verify formatting
        script: cd modern_trade_flutter && dart format --output=none --set-exit-if-changed .
      - name: Analyze
        script: cd modern_trade_flutter && flutter analyze
      - name: Test
        script: cd modern_trade_flutter && flutter test
      - name: Build debug APK
        script: cd modern_trade_flutter && flutter build apk --debug --dart-define=API_BASE_URL="$API_BASE_URL"
    artifacts:
      - modern_trade_flutter/build/app/outputs/flutter-apk/app-debug.apk

  android-release:
    name: NOVA MART Android release
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - nova_mart_android_signing
      vars:
        API_BASE_URL: https://storesync-backend-dg8z.onrender.com
        ANDROID_KEYSTORE_PATH: /tmp/nova-mart-release.jks
    scripts:
      - name: Restore signing keystore
        script: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
      - name: Install dependencies
        script: cd modern_trade_flutter && flutter pub get
      - name: Verify formatting
        script: cd modern_trade_flutter && dart format --output=none --set-exit-if-changed .
      - name: Analyze
        script: cd modern_trade_flutter && flutter analyze
      - name: Test
        script: cd modern_trade_flutter && flutter test
      - name: Build signed app bundle
        script: cd modern_trade_flutter && flutter build appbundle --release --dart-define=API_BASE_URL="$API_BASE_URL" --dart-define=SUPPORT_PHONE="$SUPPORT_PHONE" --dart-define=PRIVACY_POLICY_URL="$PRIVACY_POLICY_URL" --dart-define=TERMS_URL="$TERMS_URL"
    artifacts:
      - modern_trade_flutter/build/app/outputs/bundle/release/app-release.aab
