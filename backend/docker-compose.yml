version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: storesync-db
    environment:
      POSTGRES_DB: storesync
      POSTGRES_USER: storesync
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storesync"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - storesync-network

  redis:
    image: redis:7-alpine
    container_name: storesync-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - storesync-network

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: storesync-backend
    environment:
      DATABASE_URL: postgresql://storesync:${DB_PASSWORD:?Set DB_PASSWORD}@postgres:5432/storesync
      REDIS_URL: redis://redis:6379
      REDIS_NAMESPACE: storesync
      PORT: 3001
      HOST: 0.0.0.0
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-storesync-backend}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-storesync-operations}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SIGNATURE_SECRET: ${SIGNATURE_SECRET}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      STRAPI_API_URL: ${STRAPI_API_URL}
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID}
      ESEWA_API_KEY: ${ESEWA_API_KEY}
      ESEWA_SECRET_KEY: ${ESEWA_SECRET_KEY}
      ESEWA_BASE_URL: ${ESEWA_BASE_URL}
      ESEWA_MERCHANT_CODE: ${ESEWA_MERCHANT_CODE}
      KHALTI_API_KEY: ${KHALTI_API_KEY}
      KHALTI_SECRET_KEY: ${KHALTI_SECRET_KEY}
      KHALTI_BASE_URL: ${KHALTI_BASE_URL}
      FONEPAY_MERCHANT_ID: ${FONEPAY_MERCHANT_ID}
      FONEPAY_SECRET_KEY: ${FONEPAY_SECRET_KEY}
      FONEPAY_BASE_URL: ${FONEPAY_BASE_URL}
      PAYMENT_ENCRYPTION_KEY: ${PAYMENT_ENCRYPTION_KEY}
      BAATO_API_KEY: ${BAATO_API_KEY}
      BAATO_BASE_URL: ${BAATO_BASE_URL}
      GALLI_API_KEY: ${GALLI_API_KEY}
      GALLI_BASE_URL: ${GALLI_BASE_URL}
      DEFAULT_MAP_PROVIDER: ${DEFAULT_MAP_PROVIDER:-}
      ENABLE_ADMIN_API: true
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 35s
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.0
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    volumes:
      - backend_backups:/var/backups/storesync
    networks:
      - storesync-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  migrate:
    profiles: ["release"]
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      MIGRATION_DATABASE_URL: postgresql://storesync:${DB_PASSWORD:?Set DB_PASSWORD}@postgres:5432/storesync
      DATABASE_BACKUP_DIR: /var/backups/storesync
    command: ["node", "dist/database/deployMigrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    volumes:
      - backend_backups:/var/backups/storesync
    networks:
      - storesync-network

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        API_URL: http://backend:3001
    container_name: storesync-frontend
    environment:
      NODE_ENV: production
      ALLOW_INSECURE_INTERNAL_API: "1"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 35s
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /app/.next/cache:size=128m,noexec,nosuid,nodev,uid=1000,gid=1000
    networks:
      - storesync-network

volumes:
  postgres_data:
  redis_data:
  backend_backups:

networks:
  storesync-network:
    driver: bridge
