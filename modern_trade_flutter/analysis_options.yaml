analyzer:
  # Flutter 3.50 deprecates the umbrella Material import; keep the existing
  # app UI stable while the dedicated material_ui migration is planned.
  errors:
    deprecated_member_use: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_single_quotes: true
    use_super_parameters: true
