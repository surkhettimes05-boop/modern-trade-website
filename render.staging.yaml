# PASALHO Modern Trade staging-only Render Blueprint.
# This is intentionally NOT named render.yaml: the existing render.yaml owns
# storesync-backend and storesync-redis. Never apply this file to those services.
# Applying a new Blueprint can trigger an INITIAL deployment even with
# autoDeployTrigger: off. Do not apply until the founder explicitly approves.
services:
  - type: web
    name: pasalho-modern-staging-api
    runtime: docker
    repo: https://github.com/surkhettimes05-boop/modern-trade-website
    branch: chore/staging-render-neon-config-20261120
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    autoDeployTrigger: 'off'
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: RUN_DEPLOY_MIGRATIONS_ON_START
        value: "false"
      # Keep the administrative routes off until supervised staging QA.
      - key: ENABLE_ADMIN_API
        value: "false"
      - key: ACTIVE_MARKET
        value: NP
      - key: DEFAULT_COUNTRY_CODE
        value: NP
      - key: DEFAULT_CURRENCY_CODE
        value: NPR
      - key: DEFAULT_LOCALE
        value: en-NP
      - key: DEFAULT_TIMEZONE
        value: Asia/Kathmandu
      - key: DEFAULT_TAX_REGIME
        value: IRD
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Use the staging-modern-trade Neon branch with the runtime-only role.
      # NEVER place the migration role URL on this runtime service.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_RUNTIME_ROLE
        value: storesync_app
      - key: DATABASE_MIGRATION_ROLE
        value: storesync_migrator
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: REQUIRE_LEAST_PRIVILEGE_DATABASE_ROLE
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "5"
      # The workspace already has storesync-redis, which is NOT staging.
      # Provision separate Redis with public TLS (rediss://) before deploy.
      # Do not connect to or reuse the existing Redis instance.
      - key: REDIS_URL
        sync: false
      - key: REDIS_NAMESPACE
        value: pasalho-modern-staging
      - key: REDIS_ALLOW_PLAINTEXT_PRIVATE
        value: "false"
      # All three must match the explicitly approved staging frontend origin.
      - key: CORS_ORIGIN
        sync: false
      - key: CUSTOMER_WEB_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: PROXY_AUTH_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SIGNATURE_SECRET
        generateValue: true
      - key: OTP_HASH_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: storesync-backend
      - key: JWT_AUDIENCE
        value: storesync-operations
      - key: MEMBER_PRICING_SERVICE_TOKEN
        sync: false
      - key: MEMBER_PRICING_QUOTE_SECRET
        generateValue: true
      - key: PAYMENT_ENCRYPTION_KEY
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"
      - key: ENABLE_ELECTRONIC_PAYMENTS
        value: "false"
      # Creator QR links must point to the real staging website (CUSTOMER_WEB_URL).
      # PUBLIC_API_BASE_URL is optional and not yet known before first service creation.
      # Set it privately to the issued Render HTTPS URL only after approved deploy.
      # Sign Lite POS attribution with the exact same secret configured in Lite.
      # Distinct from PROXY_AUTH_SECRET; never commit or display its value.
      - key: CREATOR_ATTRIBUTION_HMAC_SECRET
        sync: false
      # A real Nepal-capable OTP provider is required for NODE_ENV=production.
      # Never expose demo OTP on a public staging endpoint.
      - key: SMS_PROVIDER
        value: twilio_verify
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: ENABLE_ADVANCED_ANALYTICS
        value: "false"
      - key: ENABLE_EXTERNAL_TAX_INTEGRATION
        value: "false"
      - key: ENABLE_RETURNS
        value: "false"
      - key: ENABLE_PROMOTION_ENGINE
        value: "false"
      - key: ENABLE_CUSTOMER_SEGMENTS
        value: "false"
      - key: ENABLE_OFFLINE_SYNC
        value: "false"
      - key: ENABLE_HARDWARE_DEVICES
        value: "false"
      - key: ENABLE_EXTERNAL_CMS_CDN
        value: "false"
      - key: ENABLE_FISCAL_COMPLIANCE_INTEGRATION
        value: "false"
