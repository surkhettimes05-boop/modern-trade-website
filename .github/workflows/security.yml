name: Scheduled security checks

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Scan repository security invariants
        run: npm run security:static
      - name: Scan tracked files for credential patterns
        run: node scripts/security/check-secrets.mjs
      - name: Verify backend dependency tree
        run: |
          npm ci --prefix backend
          npm audit --prefix backend --audit-level=high
          npm audit --prefix backend --audit-level=high --omit=dev
      - name: Verify frontend dependency tree
        run: |
          npm ci --prefix frontend
          npm audit --prefix frontend --audit-level=high
          npm audit --prefix frontend --audit-level=high --omit=dev
