name: Temporary frontend security lock repair

on:
  push:
    branches:
      - feat/pasalho-customer-web-refresh

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pasalho-customer-web-refresh
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Upgrade patched Next.js only
        working-directory: frontend
        run: npm install next@16.3.6 --save-exact --package-lock-only --ignore-scripts
      - name: Verify production audit
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev
      - name: Commit security update
        shell: bash
        run: |
          if git diff --quiet -- frontend/package.json frontend/package-lock.json; then
            echo "No dependency changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git commit -m "fix(deps): upgrade Next.js to patched 16.3.6"
          git push origin HEAD:feat/pasalho-customer-web-refresh
