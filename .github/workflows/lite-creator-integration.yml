name: Lite creator integration
on:
  pull_request:
permissions:
  contents: read
jobs:
  cross-repository:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: creator_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:disposable_ci_only@127.0.0.1:5432/creator_test_ci
      LITE_CREATOR_TEST_DATABASE_URL: postgresql://postgres:disposable_ci_only@127.0.0.1:5432/pasalho_creator_test_abc123
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: surkhettimes05-boop/Pasalho-lite
          ref: d3152ab500c4ef6bdfde3f1a6cfae380e672536a
          path: lite
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create isolated Lite database
        run: |
          PGPASSWORD=disposable_ci_only psql -h 127.0.0.1 -U postgres -d postgres -c 'CREATE DATABASE pasalho_creator_test_abc123'
      - name: Install and migrate Lite
        working-directory: lite
        run: |
          export DATABASE_URL="$LITE_CREATOR_TEST_DATABASE_URL"
          npm ci
          npm run db:migrate:deploy
      - name: Install Modern Trade backend
        working-directory: backend
        run: npm ci
      - name: Run actual cross-repository financial worker
        working-directory: backend
        run: |
          export LITE_CREATOR_TEST_ROOT="$GITHUB_WORKSPACE/lite"
          npm run test:ci -- --runTestsByPath src/routes/__tests__/creatorAttribution.integration.test.ts
