name: Lite creator integration
on:
  pull_request:
permissions:
  contents: read
jobs:
  cross-repository:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: storesync_jest_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:disposable_ci_only@127.0.0.1:55433/storesync_jest_test
      LITE_CREATOR_TEST_DATABASE_URL: postgresql://postgres:disposable_ci_only@127.0.0.1:55433/pasalho_creator_test_abc123
      APP_ENV: test
      SEED_OWNER_EMAIL: cashier-ci@example.invalid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: surkhettimes05-boop/Pasalho-lite
          ref: 6acee921c48055435125a8a596d0d55d4c4a4cfa
          path: lite
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Create isolated Lite database
        run: |
          PGPASSWORD=disposable_ci_only psql -h 127.0.0.1 -p 55433 -U postgres -d postgres -c 'CREATE DATABASE pasalho_creator_test_abc123'
      - name: Install and migrate Lite
        working-directory: lite
        run: |
          export DATABASE_URL="$LITE_CREATOR_TEST_DATABASE_URL"
          npm ci
          npm run db:migrate:deploy
          SEED_OWNER_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$SEED_OWNER_PASSWORD"
          export SEED_OWNER_PASSWORD
          npm run db:seed
      - name: Install Modern Trade backend
        working-directory: backend
        run: npm ci
      - name: Run actual cross-repository financial worker
        working-directory: backend
        run: |
          AUTH_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$AUTH_SECRET"
          export AUTH_SECRET
          export LITE_CREATOR_TEST_ROOT="$GITHUB_WORKSPACE/lite"
          npm run test:ci -- --runTestsByPath src/routes/__tests__/creatorAttribution.integration.test.ts
