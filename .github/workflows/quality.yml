name: Quality gates

on:
  pull_request:
  push:
    branches: [main, codex/fix-ghcr-publish]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ops/terraform/cloudflare
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.11.4
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: modern_trade_flutter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart run tool/check_secrets.dart
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - name: Generate disposable CI release key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/ci-release.jks" \
            -storepass ci-release-only \
            -keypass ci-release-only \
            -alias ci-release \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=CI Release,OU=Test,O=StoreSync,L=Kathmandu,C=NP"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/ci-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=ci-release-only" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=ci-release" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=ci-release-only" >> "$GITHUB_ENV"
      - name: Validate shrunk and obfuscated release bundle
        run: >-
          flutter build appbundle --release
          --obfuscate
          --split-debug-info=build/symbols/android-ci
          --dart-define=APP_ENV=staging
          --dart-define=API_BASE_URL=https://staging.invalid

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55433/storesync_jest_test?options=-c%20search_path%3Dstoresync_jest_test%2Cpublic
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: storesync_jest_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d storesync_jest_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Security static checks
        run: npm run security:static
      - name: Install backend
        run: npm ci --prefix backend
      - name: Install frontend
        run: npm ci --prefix frontend
      - name: Backend type-check
        run: npm run type-check --prefix backend
      - name: Backend tests
        run: npm run test:ci --prefix backend
      - name: Backend lint baseline
        run: npm run lint:ci --prefix backend
      - name: Frontend type-check
        run: npm run type-check --prefix frontend
      - name: Frontend lint
        run: npm run lint --prefix frontend
      - name: Frontend build
        run: npm run build --prefix frontend
      - name: Dependency audit
        run: |
          npm audit --prefix backend --audit-level=high --omit=dev
          npm audit --prefix frontend --audit-level=high --omit=dev
          npm audit --prefix backend --audit-level=high
          npm audit --prefix frontend --audit-level=high
