name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: modern_trade_flutter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - name: Validate unsigned release bundle
        run: flutter build appbundle --release --dart-define=API_BASE_URL=https://storesync-backend-dg8z.onrender.com

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55433/storesync_jest_test?options=-c%20search_path%3Dstoresync_jest_test%2Cpublic
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: storesync_jest_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d storesync_jest_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Security static checks
        run: npm run security:static
      - name: Install backend
        run: npm ci --prefix backend
      - name: Install frontend
        run: npm ci --prefix frontend
      - name: Backend type-check
        run: npm run type-check --prefix backend
      - name: Backend worker type-check
        run: npm run worker:type-check --prefix backend
      - name: Backend tests and coverage
        run: npm run test:coverage --prefix backend -- --coverageReporters=text-summary --coverageReporters=text --coverageReporters=json-summary --coverageReporters=lcov
      - name: Publish file-level coverage to job summary
        if: always()
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const path = 'backend/coverage/coverage-summary.json';
          if (!fs.existsSync(path)) { console.log('Coverage report unavailable'); process.exit(0); }
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const rows = Object.entries(data).filter(([name]) => name !== 'total').sort((a,b) => b[1].statements.total-b[1].statements.covered-(a[1].statements.total-a[1].statements.covered));
          const lines = ['## File-level backend coverage', '| File | Statements | Branches | Functions | Lines | Uncovered statements |', '|---|---:|---:|---:|---:|---:|'];
          for (const [name, m] of rows) lines.push('| '+name.replace(/^.*\/backend\//,'')+' | '+m.statements.pct+'% | '+m.branches.pct+'% | '+m.functions.pct+'% | '+m.lines.pct+'% | '+(m.statements.total-m.statements.covered)+' |');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n')+'\n');
          NODE
      - name: Backend lint baseline
        run: npm run lint:ci --prefix backend
      - name: Frontend type-check
        run: npm run type-check --prefix frontend
      - name: Frontend lint
        run: npm run lint --prefix frontend
      - name: Frontend build
        run: npm run build --prefix frontend
      - name: Production dependency audit
        run: |
          npm audit --prefix backend --audit-level=high --omit=dev
          npm audit --prefix frontend --audit-level=high --omit=dev
      - name: Backend development dependency security gate
        run: npm audit --prefix backend --audit-level=moderate
      - name: Frontend development dependency advisory report
        continue-on-error: true
        run: npm audit --prefix frontend --audit-level=high
