name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: modern_trade_flutter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - name: Validate unsigned release bundle
        run: flutter build appbundle --release --dart-define=API_BASE_URL=https://storesync-backend-dg8z.onrender.com

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55433/storesync_jest_test?options=-c%20search_path%3Dstoresync_jest_test%2Cpublic
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: storesync_jest_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d storesync_jest_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Security static checks
        run: npm run security:static
      - name: Install backend
        run: npm ci --prefix backend
      - name: Install frontend
        run: npm ci --prefix frontend
      - name: Backend type-check
        run: npm run type-check --prefix backend
      - name: Backend tests
        run: npm run test:ci --prefix backend
      - name: Prove isolated PostgreSQL backup and restore
        shell: bash
        run: |
          set -euo pipefail
          # This is the disposable CI database, never a production database.
          container='${{ job.services.postgres.id }}'
          docker exec "$container" pg_dump -U postgres --format=custom \
            --file=/tmp/storesync-ci.dump storesync_jest_test
          docker exec "$container" createdb -U postgres storesync_restore_test
          docker exec "$container" pg_restore -U postgres --no-owner \
            --no-privileges --exit-on-error --dbname=storesync_restore_test \
            /tmp/storesync-ci.dump
          original="$(docker exec "$container" psql -U postgres -d storesync_jest_test -At \
            -c 'SELECT COUNT(*) FROM schema_migrations')"
          restored="$(docker exec "$container" psql -U postgres -d storesync_restore_test -At \
            -c 'SELECT COUNT(*) FROM schema_migrations')"
          test "$original" -ge 53
          test "$restored" = "$original"
          for table in customers web_orders creator_referral_visits \
            creator_customer_attributions creator_purchase_events creator_reward_ledger \
            cod_cash_collections; do
            source_count="$(docker exec "$container" psql -U postgres -d storesync_jest_test -At \
              -c "SELECT COUNT(*) FROM $table")"
            restore_count="$(docker exec "$container" psql -U postgres -d storesync_restore_test -At \
              -c "SELECT COUNT(*) FROM $table")"
            test "$source_count" = "$restore_count"
          done
          echo "Isolated CI database restored: $restored migration checksums, commerce and creator row counts match"
      - name: Backend lint baseline
        run: npm run lint:ci --prefix backend
      - name: Frontend type-check
        run: npm run type-check --prefix frontend
      - name: Frontend lint
        run: npm run lint --prefix frontend
      - name: Frontend build
        run: npm run build --prefix frontend
      - name: Production dependency audit
        run: |
          npm audit --prefix backend --audit-level=high --omit=dev
          npm audit --prefix frontend --audit-level=high --omit=dev
      - name: Development dependency advisory report
        continue-on-error: true
        run: |
          npm audit --prefix backend --audit-level=high
          npm audit --prefix frontend --audit-level=high
