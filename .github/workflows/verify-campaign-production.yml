name: Verify campaign production endpoints

on:
  push:
    branches:
      - feat/unified-campaign-manager

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe live endpoints
        shell: bash
        run: |
          set -u
          probe() {
            label="$1"
            url="$2"
            body="/tmp/$(echo "$label" | tr ' /' '__').txt"
            status="$(curl -sS -L --max-time 30 -o "$body" -w '%{http_code}' "$url" || echo curl_error)"
            echo "===== $label ====="
            echo "url=$url"
            echo "status=$status"
            head -c 2500 "$body" 2>/dev/null || true
            echo
          }
          probe "render ready" "https://storesync-backend-dg8z.onrender.com/api/health/ready"
          probe "render campaigns" "https://storesync-backend-dg8z.onrender.com/api/public/campaigns?channel=WEB"
          probe "vercel campaigns" "https://modern-trade-website-vwqm-nine.vercel.app/api/public/campaigns?channel=WEB"
