name: Refresh backend security lock

on:
  push:
    branches: [codex/fix-ghcr-publish]
    paths:
      - '.github/workflows/refresh-backend-security-lock.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-ghcr-publish
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Refresh vulnerable production resolutions
        working-directory: backend
        run: npm audit fix --package-lock-only --omit=dev
      - name: Verify production audit
        working-directory: backend
        run: npm audit --audit-level=high --omit=dev
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- backend/package-lock.json; then
            echo "No lockfile change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "fix: refresh vulnerable backend production dependencies"
          git push origin HEAD:codex/fix-ghcr-publish
