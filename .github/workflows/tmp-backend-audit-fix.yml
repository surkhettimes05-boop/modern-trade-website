name: Temporary backend audit lock repair

on:
  push:
    branches:
      - feat/pasalho-customer-web-refresh

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pasalho-customer-web-refresh
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Repair compatible audited versions
        working-directory: backend
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Commit repaired lockfile
        shell: bash
        run: |
          if git diff --quiet -- backend/package-lock.json; then
            echo "No lockfile changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "fix(deps): repair backend audited transitive versions"
          git push origin HEAD:feat/pasalho-customer-web-refresh
