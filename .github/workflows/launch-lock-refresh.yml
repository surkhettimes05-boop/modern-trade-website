name: Launch lockfile security refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'launch-hardening-ci' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: launch-hardening-ci
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Refresh backend security-compatible lockfile
        run: |
          npm audit fix --prefix backend --package-lock-only
          npm audit --prefix backend --audit-level=high --omit=dev
          npm audit --prefix backend --audit-level=high || true
      - name: Refresh frontend security-compatible lockfile
        run: |
          npm install --prefix frontend --package-lock-only --save-exact next@16.3.8 eslint-config-next@16.3.8
          npm audit fix --prefix frontend --package-lock-only
          npm audit --prefix frontend --audit-level=high --omit=dev
          npm audit --prefix frontend --audit-level=high || true
      - name: Commit lockfile refresh
        shell: bash
        run: |
          git diff --check
          if git diff --quiet -- backend/package.json backend/package-lock.json frontend/package.json frontend/package-lock.json; then
            echo "No dependency lock changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json frontend/package.json frontend/package-lock.json
          git commit -m "chore: refresh dependency security lockfiles"
          git push origin HEAD:launch-hardening-ci
